<section class="panel rejects"><div class="panel-head"><h2>隔离分布</h2><span>{{data.quarantine|length}} 条</span></div><div class="table-wrap"><table><thead><tr><th>行</th><th>观测ID</th><th>原因码</th></tr></thead><tbody>{% for q in data.quarantine %}<tr><td class="num">{{q.line}}</td><td>{{q.id}}</td><td><span class="severity" title="{{q.raw}}">{{q.code}}</span></td></tr>{% else %}<tr><td colspan="3">无隔离观测</td></tr>{% endfor %}</tbody></table></div></section>
