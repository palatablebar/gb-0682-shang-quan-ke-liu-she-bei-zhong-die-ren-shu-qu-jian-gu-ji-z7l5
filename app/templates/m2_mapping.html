{% extends "base.html" %}{% block content %}<div class="dashboard"><section class="panel observations"><div class="panel-head"><h2>区域归整</h2><span>{{data.rows|length}} 条</span></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>UTC时刻</th><th>区域</th><th>类型</th><th>人数</th></tr></thead><tbody>{% for r in data.rows %}<tr><td>{{r.id}}</td><td>{{r.bucket}}</td><td>{{r.left}} / {{r.right or '—'}}</td><td>{{r.kind}}</td><td class="num">{{r.count}}</td></tr>{% endfor %}</tbody></table></div></section><section class="panel controls"><div class="panel-head"><h2>区域设备</h2></div><div class="region-map"><b>A<span>东门</span></b><b>B<span>中庭</span></b><b>C<span>西门</span></b></div></section>{% include "rejected.html" %}</div>{% endblock %}
