{% extends "base.html" %}{% block content %}<div class="dashboard"><section class="panel observations"><div class="panel-head"><h2>观测归档</h2><span>{{history|length}} 批</span></div><div class="table-wrap"><table><thead><tr><th>批次</th><th>复核版本</th><th>状态</th></tr></thead><tbody>{% for h in history %}<tr><td>{{h.id}}</td><td>{{h.version}}</td><td>{{h.decision}}</td></tr>{% endfor %}</tbody></table></div><div class="action-row"><a href="/api/archive/{{run.run_id}}/export.csv" class="filled link-button">保存区间证据</a><button id="approve" data-id="{{run.run_id}}" data-rev="{{run.review_version}}">复核通过</button><button id="print-report">打印</button></div></section><section class="panel controls"><div class="panel-head"><h2>证据指纹</h2></div><p class="hash">{{data.archive.sha256}}</p><div class="status-grid"><div><b>{{data.archive.evidence_count}}</b><span>证据条目</span></div></div></section>{% include "rejected.html" %}</div>{% endblock %}
