{% extends "base.html" %}{% block content %}<div class="dashboard"><section class="panel observations"><div class="panel-head"><h2>设备原始观测</h2><span>{{data.encoding}}</span></div><div class="table-wrap"><table><thead><tr><th>行</th><th>时段</th><th>设备</th><th>区域</th><th>人数</th></tr></thead><tbody>{% for r in data.rows %}<tr><td class="num">{{r._line}}</td><td>{{r.bucket}}</td><td>{{r.kind}}</td><td>{{r.left}} {{r.right}}</td><td class="num">{{r.count}}</td></tr>{% endfor %}</tbody></table></div></section><section class="panel controls"><div class="panel-head"><h2>载入观测</h2></div><form id="observation-form"><label>样例<select name="sample"><option>dirty.csv</option><option>clean.csv</option><option>legacy.csv</option></select></label><label>CSV观测<textarea name="csv" rows="4" placeholder="粘贴观测记录"></textarea></label><button class="filled">载入计算</button></form><div class="status-grid"><div><b>{{data.blank_count}}</b><span>空行</span></div><div><b>{{data.header_count}}</b><span>表头</span></div></div></section>{% include "rejected.html" %}</div>{% endblock %}
